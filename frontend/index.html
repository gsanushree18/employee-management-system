<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Employee Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-xs">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 p-2 rounded-lg text-white shadow-md shadow-indigo-600/20">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                </svg>
            </div>
            <span class="text-xl font-bold text-slate-900 tracking-wide">EMS Enterprise</span>
        </div>
        <div class="flex items-center space-x-4">
            <button id="add-emp-btn" onclick="openModal()" class="hidden bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-md shadow-indigo-600/20 cursor-pointer">
                + Add Employee
            </button>
            <button id="auth-btn" onclick="handleAuth()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer">
                Admin Login
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 py-8">
        <!-- Search & Filter Header -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Employee Directory</h1>
                <p class="text-slate-500 text-sm">Manage organization employees, roles, and details.</p>
            </div>
            <div class="flex items-center gap-3 w-full md:w-auto">
                <input type="text" id="search-input" placeholder="Search by name..." 
                    class="bg-white border border-slate-300 px-4 py-2 rounded-lg text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-indigo-600 w-full md:w-64 shadow-2xs">
                <select id="dept-filter" class="bg-white border border-slate-300 px-4 py-2 rounded-lg text-sm text-slate-800 focus:outline-none focus:border-indigo-600 shadow-2xs">
                    <option value="All">All Departments</option>
                    <option value="Engineering">Engineering</option>
                    <option value="Human Resources">Human Resources</option>
                    <option value="Finance">Finance</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Sales">Sales</option>
                    <option value="Customer Support">Customer Support</option>
                </select>
            </div>
        </div>

        <!-- Table Container -->
        <div class="bg-white border border-slate-200 rounded-xl shadow-lg shadow-slate-200/50 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs uppercase tracking-wider">
                            <th class="px-6 py-4 font-semibold">Name</th>
                            <th class="px-6 py-4 font-semibold">Department</th>
                            <th class="px-6 py-4 font-semibold">Designation</th>
                            <th class="px-6 py-4 font-semibold">Email</th>
                            <th class="px-6 py-4 font-semibold">Phone</th>
                            <th class="px-6 py-4 font-semibold">Salary</th>
                            <th class="px-6 py-4 font-semibold text-right action-col hidden">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="employee-table-body" class="divide-y divide-slate-100 text-sm">
                        <!-- Dynamic Rows Here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Add/Edit Modal -->
    <div id="emp-modal" class="fixed inset-0 bg-slate-900/30 backdrop-blur-xs hidden items-center justify-center p-4">
        <div class="bg-white border border-slate-200 rounded-2xl w-full max-w-lg p-6 shadow-2xl">
            <h2 id="modal-title" class="text-xl font-bold text-slate-900 mb-4">Add New Employee</h2>
            <form id="emp-form" class="space-y-4">
                <input type="hidden" id="emp-id">
                <div>
                    <label class="block text-slate-700 text-xs font-medium mb-1">Full Name</label>
                    <input type="text" id="name" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-indigo-600">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-slate-700 text-xs font-medium mb-1">Email</label>
                        <input type="email" id="email" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-indigo-600">
                    </div>
                    <div>
                        <label class="block text-slate-700 text-xs font-medium mb-1">Phone</label>
                        <input type="text" id="phone" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-indigo-600">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-slate-700 text-xs font-medium mb-1">Department</label>
                        <select id="department" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-indigo-600">
                            <option value="Engineering">Engineering</option>
                            <option value="Human Resources">Human Resources</option>
                            <option value="Finance">Finance</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Sales">Sales</option>
                            <option value="Customer Support">Customer Support</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-700 text-xs font-medium mb-1">Designation</label>
                        <input type="text" id="designation" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-indigo-600">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-slate-700 text-xs font-medium mb-1">Salary ($)</label>
                        <input type="number" id="salary" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-indigo-600">
                    </div>
                    <div>
                        <label class="block text-slate-700 text-xs font-medium mb-1">Date of Joining</label>
                        <input type="date" id="date_of_joining" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-indigo-600">
                    </div>
                </div>
                <div class="flex justify-end space-x-3 pt-4">
                    <button type="button" onclick="closeModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer">Cancel</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer">Save Employee</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Frontend Script Logic -->
    <script>
        const token = localStorage.getItem("token");
        const authBtn = document.getElementById("auth-btn");
        const addEmpBtn = document.getElementById("add-emp-btn");

        if (token) {
            authBtn.textContent = "Logout";
            authBtn.className = "bg-rose-50 text-rose-600 hover:bg-rose-100 border border-rose-200 px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer";
            addEmpBtn.classList.remove("hidden");
            document.querySelectorAll(".action-col").forEach(el => el.classList.remove("hidden"));
        } else {
            authBtn.textContent = "Admin Login";
            authBtn.className = "bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer";
        }

        function handleAuth() {
            if (token) {
                localStorage.removeItem("token");
                window.location.reload();
            } else {
                window.location.href = "login.html";
            }
        }

        async function fetchEmployees() {
            const search = document.getElementById("search-input").value;
            const department = document.getElementById("dept-filter").value;
            
            let url = `http://localhost:3000/api/employees?search=${search}&department=${department}`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.success) {
                    renderTable(data.employees);
                }
            } catch (err) {
                console.error("Failed to fetch employees", err);
            }
        }

        function renderTable(employees) {
            const tbody = document.getElementById("employee-table-body");
            tbody.innerHTML = "";

            if (employees.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-8 text-center text-slate-400">No employees found.</td></tr>`;
                return;
            }

            employees.forEach(emp => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-50/80 transition border-b border-slate-100";
                tr.innerHTML = `
                    <td class="px-6 py-4 font-semibold text-slate-900">${emp.name}</td>
                    <td class="px-6 py-4"><span class="bg-indigo-50 text-indigo-700 text-xs px-2.5 py-1 rounded-full border border-indigo-100 font-medium">${emp.department}</span></td>
                    <td class="px-6 py-4 text-slate-600">${emp.designation}</td>
                    <td class="px-6 py-4 text-slate-500">${emp.email}</td>
                    <td class="px-6 py-4 text-slate-500">${emp.phone}</td>
                    <td class="px-6 py-4 text-emerald-600 font-semibold">₹${emp.salary.toLocaleString()}</td>
                    <td class="px-6 py-4 text-right action-col ${token ? '' : 'hidden'}">
                        <button onclick="deleteEmployee(${emp.id})" class="text-rose-600 hover:text-rose-700 text-xs bg-rose-50 border border-rose-200 px-3 py-1 rounded-md transition cursor-pointer font-medium">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById("search-input").addEventListener("input", fetchEmployees);
        document.getElementById("dept-filter").addEventListener("change", fetchEmployees);

        function openModal() {
            document.getElementById("emp-modal").classList.remove("hidden");
            document.getElementById("emp-modal").classList.add("flex");
        }

        function closeModal() {
            document.getElementById("emp-modal").classList.add("hidden");
            document.getElementById("emp-modal").classList.remove("flex");
            document.getElementById("emp-form").reset();
        }

        document.getElementById("emp-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                phone: document.getElementById("phone").value,
                department: document.getElementById("department").value,
                designation: document.getElementById("designation").value,
                salary: Number(document.getElementById("salary").value),
                date_of_joining: document.getElementById("date_of_joining").value
            };

            try {
                const res = await fetch("http://localhost:3000/api/employees", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    closeModal();
                    fetchEmployees();
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("Error saving employee");
            }
        });

        async function deleteEmployee(id) {
            if (!confirm("Are you sure you want to delete this employee?")) return;
            try {
                const res = await fetch(`http://localhost:3000/api/employees/${id}`, {
                    method: "DELETE",
                    headers: { "Authorization": `Bearer ${token}` }
                });
                const data = updates = await res.json();
                if (data.success) {
                    fetchEmployees();
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("Error deleting employee");
            }
        }

        // Initial Load
        fetchEmployees();
    </script>
</body>
</html>
